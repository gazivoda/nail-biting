    <!-- Fonts are self-hosted. The @font-face rules live in src/index.css and ship
         inside the app CSS bundle, so there is no third-party stylesheet on the
         critical path: the fonts.googleapis.com <link> used to be render-blocking
         on a cross-origin host and accounted for ~894 ms of the mobile LCP render
         delay. Its two preconnects went with it — there is nothing left to connect
         to. Preload only the two latin faces needed for first paint (Instrument
         Serif for the hero <h1>, Inter for the SSR article body); latin-ext,
         italic and mono resolve on demand through unicode-range. `crossorigin` is
         required even same-origin — fonts are always fetched in CORS mode, and
         without it the preload is discarded and fetched a second time. -->
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Entity graph. Every node that represents *us* carries a stable @id so the
         same entity is never re-declared as an unlinked duplicate:
           #organization — the company (referenced by publisher/worksFor everywhere)
           #website      — this site      #app — the product      #person — the founder
         server.js reuses these exact @ids (SCHEMA_PUBLISHER / SCHEMA_AUTHOR / the
         /pricing mainEntity reference), so a consumer merges every mention of an
         entity into one node instead of seeing three lookalikes per page.

         The same rule now covers the *page* node, not just the entity nodes.
         The homepage used to be described twice over: the FAQPage block below
         was anonymous, while server.js injected a separate WebPage claiming
         @id https://stopbiting.today/ (the homeWebPage const, which carries the
         speakable spec and dateModified). Two page-level nodes, no link between
         them. FAQPage is a subClassOf WebPage — verified against
         https://schema.org/FAQPage — so giving the FAQPage that same @id merges
         the two into one page entity that is both a WebPage and an FAQPage,
         rather than leaving a typed-but-unaddressed node beside an addressed
         one. Safe to hardcode the bare origin here because server.js strips the
         FAQPage block from every route except `/`, so this @id can never be
         emitted on a URL it does not describe. -->

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://stopbiting.today/#website",
      "name": "Stop Biting",
      "url": "https://stopbiting.today/",
      "description": "Stop nail biting with on-device AI detection. Real-time webcam monitoring, habit reversal training guidance, and streak tracking — 100% private.",
      "inLanguage": "en",
      "publisher": { "@id": "https://stopbiting.today/#organization" }
    }
    </script>

    <!-- Structured Data: Organization.
         `url` and `logo` MUST stay byte-identical to SCHEMA_PUBLISHER in
         server.js. Both declare @id …/#organization, so every JSON-LD consumer
         merges them into a single entity — and they used to disagree on both
         properties at once (`https://stopbiting.today` vs the trailing-slash
         form here; a plain URL string vs an ImageObject there), which left one
         entity describing itself two contradictory ways on every article page.
         Pinned shape: `url` keeps the trailing slash (it matches <link rel=
         canonical> and the WebSite node above); `logo` is the ImageObject form,
         since schema.org/logo ranges over ImageObject | URL and the richer of
         the two is the one server.js emits.
         `width`/`height` are deliberately NOT asserted on the logo: the asset is
         genuinely 512×512 (verified with sips/file on public/icons/icon-512x512
         .png), but schema.org/width and /height range over Distance |
         QuantitativeValue — not Number — so a bare `512` would repeat the exact
         wrong-range mistake that got `billingIncrement` dropped from the Offers.
         Google needs only `url` on a logo ImageObject. Omitting them also keeps
         this node byte-identical to server.js, which is the point.
         Also deliberately absent: `address`, `foundingDate`, `telephone`. No
         registered address, incorporation date or support phone number exists
         anywhere in this repo or on the site, and an omitted recommended
         property costs nothing while a fabricated one is a trust defect.
         `contactPoint` IS included because hello@stopbiting.today is real and
         already published to readers — the Landing.tsx footer links it, and
         the privacy, terms and refund pages all name it as the contact route. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://stopbiting.today/#organization",
      "name": "Stop Biting",
      "url": "https://stopbiting.today/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://stopbiting.today/icons/icon-512x512.png"
      },
      "description": "Makers of Stop Biting — an on-device AI tool to stop nail biting using real-time webcam detection and habit reversal training.",
      "email": "hello@stopbiting.today",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "hello@stopbiting.today",
        "availableLanguage": "en"
      },
      "sameAs": [
        "https://github.com/gazivoda/nail-biting"
      ]
    }
    </script>

    <!-- Structured Data: SoftwareApplication — the single product node for the
         whole site. /pricing REFERENCES this @id rather than declaring its own
         copy, so the commercial page describes one product, not two.

         Billing period: the paid Offers previously carried `billingIncrement`,
         which is invalid two ways — schema.org declares it on
         UnitPriceSpecification (not Offer) with a range of Number (not a
         Duration string), so a conforming parser dropped it and the $2.99 and
         $29.00 plans became two bare, indistinguishable prices. It is now a
         nested `priceSpecification` → UnitPriceSpecification → `billingDuration`,
         which is the combination schema.org actually defines:
           schema.org/priceSpecification  domain Offer, range PriceSpecification
           schema.org/UnitPriceSpecification  subClassOf PriceSpecification
           schema.org/billingDuration     domain UnitPriceSpecification,
                                          range Duration | Number | QuantitativeValue
         `price`/`priceCurrency` stay on the Offer as well (both list Offer in
         their domain) because that is what Google reads for rich results.

         The $0 Offer is bounded. It previously carried no duration at all, so
         the markup advertised a permanently free tier while the visible
         /pricing copy says "Start with a 3-day free trial — no credit card
         required". `eligibleDuration` is the property that fixes it —
         https://schema.org/eligibleDuration declares domain Demand | Offer and
         range QuantitativeValue, so it belongs directly on the Offer and must
         be a QuantitativeValue, not a Duration string. "DAY" is the UN/CEFACT
         Common Code `unitCode` expects. The price stays "0": the trial really
         is free, it is just no longer open-ended. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "@id": "https://stopbiting.today/#app",
      "name": "Stop Biting",
      "alternateName": ["Stop Nail Biting AI Tracker", "Nail Habit Tracker", "Onychophagia App"],
      "description": "Web and desktop app that uses your webcam and on-device AI (MediaPipe) to detect nail biting (onychophagia) in real-time. Sounds an alarm the moment your hand nears your mouth. Includes streak tracking, incident logging, habit reversal training guidance, and 7-day bite history. Zero data leaves your device.",
      "url": "https://stopbiting.today/",
      "applicationCategory": "HealthApplication",
      "applicationSubCategory": "Habit Tracking",
      "operatingSystem": "Web, macOS 12+, Windows 10+",
      "offers": [
        {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "name": "Free trial",
          "description": "Full detection and tracking features — free 3-day trial, no credit card required",
          "eligibleDuration": {
            "@type": "QuantitativeValue",
            "value": 3,
            "unitCode": "DAY"
          }
        },
        {
          "@type": "Offer",
          "price": "2.99",
          "priceCurrency": "USD",
          "name": "Monthly",
          "description": "Unlimited AI detection, streak tracking, full incident history and all alert types",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "2.99",
            "priceCurrency": "USD",
            "billingDuration": "P1M"
          }
        },
        {
          "@type": "Offer",
          "price": "29.00",
          "priceCurrency": "USD",
          "name": "Yearly",
          "description": "Everything in Monthly plus priority support — saves 19% versus billing monthly",
          "priceSpecification": {
            "@type": "UnitPriceSpecification",
            "price": "29.00",
            "priceCurrency": "USD",
            "billingDuration": "P1Y"
          }
        }
      ],
      "featureList": [
        "Real-time nail biting detection via webcam AI",
        "100% on-device processing — no cloud, no data sent",
        "Sound and visual alerts when nail biting detected",
        "Streak tracking and all-time best record",
        "Incident log with trigger tagging (stress, focus, boredom)",
        "7-day bite frequency chart",
        "Habit reversal training (HRT) guidance built in",
        "Works as PWA — install directly from browser, no app store needed",
        "Free 60-second live demo — try detection in the browser, no signup"
      ],
      "keywords": "stop nail biting, onychophagia, habit reversal training, nail biting remedies, nail biting treatment, compulsive habits, BFRB, body-focused repetitive behavior",
      "screenshot": "https://stopbiting.today/og-image.png",
      "softwareVersion": "1.1",
      "releaseNotes": "PWA support added — install directly from browser",
      "publisher": { "@id": "https://stopbiting.today/#organization" }

    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "@id": "https://stopbiting.today/",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Why do people bite their nails?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nail biting (onychophagia) is a body-focused repetitive behaviour affecting up to 30% of adults. Common triggers are stress, anxiety, boredom, and deep focus. The habit usually starts in childhood and becomes automatic — happening without conscious awareness. Genetic predisposition, perfectionism, and OCD-spectrum tendencies are also linked."
          }
        },
        {
          "@type": "Question",
          "name": "What are the best remedies to stop nail biting?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The evidence-based options are habit reversal training (the strongest by some margin), bitter-taste polishes like Mavala Stop, real-time awareness tools such as AI detection, competing response training, and stress reduction. Most people do best combining an awareness method with a competing response rather than relying on any single remedy."
          }
        },
        {
          "@type": "Question",
          "name": "What is habit reversal training for nail biting?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Habit reversal training (HRT) is a cognitive-behavioural method with three parts: awareness training — learning to notice every time you bite; a competing response — an incompatible action like clenching a fist or pressing your palms flat; and social support. In the original Azrin and Nunn clinical trial, participants who practised it consistently achieved a near-complete reduction in biting."
          }
        },
        {
          "@type": "Question",
          "name": "Is nail biting harmful?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Chronic nail biting causes dental damage including chipped teeth and jaw strain, nail fold infections, transfer of pathogens from fingers to mouth, and permanent nail deformity in severe cases. The visible damage also drives shame and social anxiety, which increases biting — a self-reinforcing cycle."
          }
        },
        {
          "@type": "Question",
          "name": "Does Stop Biting send my camera feed to the internet?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Detection uses MediaPipe — Google's WebAssembly vision framework — running entirely on your device. Your camera feed is never uploaded, streamed, or stored anywhere outside it. There are zero network requests during detection: you can disconnect from the internet and the app works identically."
          }
        },
        {
          "@type": "Question",
          "name": "How long does it take to stop biting your nails?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most people notice more biting in week one, because they are finally catching episodes they used to miss. Frequency typically starts dropping meaningfully between weeks two and four, and the competing response starts feeling natural around weeks six to eight. Habit-formation research suggests a median of roughly two months for a new response to become automatic."
          }
        }
      ]
    }
    </script>

    <!-- Structured Data: MedicalCondition — Onychophagia.
         Deliberately minimal, and it must stay that way. Every numeric,
         epidemiological and authority claim was removed on 2026-09-10:
           · prevalence "20–30% of adults and up to 45% of children" (description)
           · `epidemiology` "peaks at 45% in adolescents aged 11–14"
           · the DSM-5 "Other Specified Obsessive-Compulsive and Related
             Disorders" classification
           · `cause` (the basal-ganglia habit-loop mechanism)
           · `recognizingAuthority` → American Psychiatric Association
         None of it was sourced anywhere on this site — there are zero outbound
         citations — and none of it was visible to a reader: across the 71 pages
         that carry this block the 45% figure appeared on 0 and the 20–30%
         figure on 1. The two prevalence claims also contradicted each other
         (45% "of children" vs 45% "in adolescents aged 11–14"). Google's rule
         is not to mark up content the reader cannot see, and unsourced YMYL
         medical statistics are the worst case for it: they put every other
         schema block on the site at risk of being discounted wholesale.
         What survives is definitional, non-statistical, and mirrored by copy
         that is actually rendered (see the FAQPage block above, which the
         homepage renders verbatim). Do not re-add a figure, a classification or
         a named authority here unless an on-page, visible citation ships with
         it in the same change. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalCondition",
      "name": "Onychophagia",
      "alternateName": ["nail biting", "chronic nail biting", "compulsive nail biting"],
      "description": "Onychophagia is the clinical term for chronic, compulsive nail biting — a body-focused repetitive behaviour (BFRB).",
      "associatedAnatomy": {
        "@type": "AnatomicalStructure",
        "name": "Fingernails"
      },
      "possibleTreatment": [
        {
          "@type": "MedicalTherapy",
          "name": "Habit Reversal Training (HRT)",
          "description": "Cognitive-behavioural protocol with three components: awareness training, a competing response, and social support."
        },
        {
          "@type": "MedicalTherapy",
          "name": "Bitter-taste nail polish",
          "description": "Aversion therapy using a bitter-tasting polish (Mavala Stop, Orly No Bite) applied to the nails as a deterrent."
        }
      ],
      "relevantSpecialty": "https://schema.org/Psychiatric"
    }
    </script>
